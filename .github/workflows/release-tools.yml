name: Release tooling tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/spanopticon
          ref: 60e605ff39923c61bccc6c732181f82e557be35a
          path: .policy-source
          persist-credentials: false
      - run: python3 actions/release-channel/verify_policy_vendor.py .policy-source
      - run: python3 -m unittest discover -s actions/release-channel -p 'test_*.py' -v
