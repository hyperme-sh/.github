name: Release tooling tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/spanopticon
          ref: 7f5b9b21363d41b8f8ed14571195d10f4a11899f
          path: .policy-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 actions/release-channel/verify_policy_vendor.py .policy-source
      - run: python3 -m unittest discover -s actions/release-channel -p 'test_*.py' -v
