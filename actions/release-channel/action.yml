name: Verified stable packages
description: Publish exact tested Actions artifacts only on an explicit stable tag.
inputs:
  service-repositories:
    description: JSON map of service names to approved registry/repository paths; requires service-channels.json in the tested artifact
    default: '{}'
  workflow:
    description: Repository-relative validation workflow path
    required: true
  package-source:
    description: Tested package source (actions or ghcr)
    default: actions
  token:
    description: Repository-scoped token with contents write and actions read
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: '0.11.26'
        enable-cache: false
    - shell: bash
      working-directory: ${{ runner.temp }}
      env:
        SERVICE_REPOSITORIES: ${{ inputs.service-repositories }}
        PACKAGE_SOURCE: ${{ inputs.package-source }}
        GH_TOKEN: ${{ inputs.token }}
        VALIDATION_WORKFLOW: ${{ inputs.workflow }}
      run: uv run --no-project --no-config --managed-python --python 3.12 python "$GITHUB_ACTION_PATH/release.py"
